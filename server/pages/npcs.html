<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Age of War · NPCs</title>

<meta name="description" content="NPC targets in Age of War are learned by scouting them in the game.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<style>

  :root{

    --bg:#0a2036; --gold:#e8c66a; --gold-bright:#ffe3a0;

    --ink:#eaf3fb; --muted:#9db8cf; --line:#265d84;

  }

  *{box-sizing:border-box}

  body{

    margin:0; background:var(--bg);

    background-image:radial-gradient(1200px 640px at 50% -12%, #15507a 0%, var(--bg) 60%);

    background-attachment:fixed;

    color:var(--ink); font-family:"Spectral",Georgia,serif; font-size:16px; line-height:1.55;

  }

  a{color:var(--gold-bright); text-decoration:none}

  a:hover{text-decoration:underline}

  .wrap{max-width:760px; margin:0 auto; padding:0 16px}

  .topbar{background:rgba(18,14,9,.92); border-bottom:1px solid var(--line)}

  .topbar .wrap{display:flex; align-items:center; height:58px}

  .brand{font-family:"Cinzel",serif; font-weight:700; color:var(--gold); letter-spacing:.02em;

    font-size:clamp(0.72rem, 2.85vw, 1.02rem); white-space:nowrap}

  .brand span{color:var(--gold-bright)}

  .brand a{color:var(--gold)}

  header{padding:36px 0 8px}

  h1{font-family:"Cinzel",serif; font-weight:600; color:var(--gold-bright); font-size:1.6rem; margin:0 0 10px}

  p{color:var(--muted)}

  .rule{height:1px; background:linear-gradient(90deg, transparent, var(--line), transparent); margin:18px 0}

</style>

</head>

<body>

<div class="topbar"><div class="wrap">

  <div class="brand"><a href="/">Age of War</a> · <span>NPCs</span></div>

</div></div>

<header class="hero"><div class="wrap">

  <h1>NPCs</h1>

  <p>Valleys, flats, barbarian cities and historic capitals keep their defenders on the server. Scout a target in the game to see what is standing there.</p>

  <div class="rule"></div>

  <p><a href="/">Return to the realm</a></p>

</div></header>

</body>

</html>
